<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h2>🛒 Fashion Store </h2>
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner -->
    <section class="banner">
        <div class="banner-content">
            <h1>Welcome to My Store</h1>
            <p>Best Products at Best Prices</p>

            <a href="#products">
                <button>Shop Now</button>
            </a>
        </div>
    </section>

    <!-- Products -->
    <section class="featured" id="products">

        <h2>Our Products</h2>

        <div class="product-container">

            <!-- Shoes -->
            <div class="card">
                <img src="images/shoes.jpg" alt="Shoes">
                <h3>Shoes</h3>
                <p>₹1999</p>
                <button onclick="addToCart('Shoes',1999)">
                    Add to Cart
                </button>
            </div>

            <!-- Watch -->
            <div class="card">
                <img src="images/watch.jpg" alt="Watch">
                <h3>Watch</h3>
                <p>₹999</p>
                <button onclick="addToCart('Watch',999)">
                    Add to Cart
                </button>
            </div>

            <!-- Headphone -->
            <div class="card">
                <img src="images/headphone.jpg" alt="Headphone">
                <h3>Headphone</h3>
                <p>₹1499</p>
                <button onclick="addToCart('Headphone',1499)">
                    Add to Cart
                </button>
            </div>

            <!-- Bag -->
            <div class="card">
                <img src="images/bag.jpg" alt="Bag">
                <h3>Bag</h3>
                <p>₹899</p>
                <button onclick="addToCart('Bag',899)">
                    Add to Cart
                </button>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Store | All Rights Reserved</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
